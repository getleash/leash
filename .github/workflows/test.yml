name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build all workspaces (topo order)
        run: npm run build

      - name: Run vitest across all workspaces
        run: npm test --workspaces

  solidity:
    name: Solidity (forge --fork)
    runs-on: ubuntu-latest
    env:
      # Forge fork tests need a Base RPC. Prefer a dedicated endpoint via
      # the BASE_RPC_URL secret — the public mainnet.base.org is load-
      # balanced and flakes under CI parallelism. Fall back to the public
      # endpoint so the job runs without the secret configured; expect
      # occasional retries until a dedicated RPC is wired up.
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Nightly carries the op-revm fix for the Isthmus hardfork's
          # operator-fee L1Block fields; stable still panics with
          # "Missing operator fee scalar for isthmus L1 Block" when
          # forking current Base mainnet state.
          version: nightly

      - name: Forge build
        working-directory: contracts
        run: forge build --sizes

      - name: Forge test (fork)
        working-directory: contracts
        run: forge test --fork-url "$BASE_RPC_URL" -vv
